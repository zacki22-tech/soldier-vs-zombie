<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soldier vs Zombies</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", Arial, sans-serif; }
  canvas { background: #2b3a2b; border: 3px solid #444; cursor: crosshair; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="game" width="960" height="640"></canvas>

<script>
// ===================== SETUP =====================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const keys = {};
const mouse = { x: W / 2, y: H / 2, down: false };

addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "r") startReload();
  if (e.key.toLowerCase() === "p") paused = !paused;
  if (e.key === "Enter" && state === "gameover") resetGame();
  if (e.key === "Enter" && state === "menu") { state = "playing"; resetGame(); }
  if (["arrowup","arrowdown"," "].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
function setMouse(e) {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
}
canvas.addEventListener("mousemove", setMouse);
canvas.addEventListener("mousedown", e => { setMouse(e); mouse.down = true;
  if (state === "menu") { state = "playing"; resetGame(); }
  else if (state === "gameover") resetGame();
});
addEventListener("mouseup", () => mouse.down = false);
canvas.addEventListener("contextmenu", e => e.preventDefault());

// ===================== GAME STATE =====================
let state = "menu";   // menu | playing | gameover
let paused = false;
let player, bullets, zombies, particles, pickups, floaters;
let wave, spawnQueue, spawnTimer, intermission, score, kills, shake;
let highScore = Number(localStorage.getItem("svz_high") || 0);

const ZTYPES = {
  walker: { hp: 3, speed: 55,  r: 15, dmg: 10, color: "#6aa84f", points: 10 },
  runner: { hp: 1, speed: 120, r: 12, dmg: 8,  color: "#b6d77a", points: 15 },
  brute:  { hp: 10, speed: 40, r: 24, dmg: 22, color: "#38761d", points: 50 },
  boss:   { hp: 60, speed: 48, r: 42, dmg: 35, color: "#6a1b9a", points: 500 },
};
const BOSS_EVERY = 5; // every 5th wave is a boss wave
let bossTimer = 0;

function resetGame() {
  state = "playing";
  paused = false;
  player = { x: W / 2, y: H / 2, r: 16, speed: 210, hp: 100, maxHp: 100,
             mag: 30, magSize: 30, reloading: false, reloadT: 0, fireCd: 0, angle: 0, flash: 0, hurtT: 0 };
  bullets = []; zombies = []; particles = []; pickups = []; floaters = [];
  wave = 0; score = 0; kills = 0; shake = 0;
  spawnQueue = []; spawnTimer = 0; intermission = 1.5;
}

function startWave() {
  wave++;
  const n = 5 + wave * 3;
  spawnQueue = [];
  for (let i = 0; i < n; i++) {
    let t = "walker";
    const roll = Math.random();
    if (wave >= 2 && roll < 0.25) t = "runner";
    if (wave >= 3 && roll > 0.9) t = "brute";
    spawnQueue.push(t);
  }
  spawnTimer = 0;
  if (wave % BOSS_EVERY === 0) {
    // Boss wave: fewer regular zombies, boss spawns first (queue pops from the end)
    spawnQueue = spawnQueue.slice(0, Math.floor(n / 2));
    spawnQueue.push("boss");
    bossTimer = 4;
    shake = 14;
    addFloater(W / 2, 120, "BOSS WAVE " + wave + "!", "#ff4d4d", 3);
  } else {
    addFloater(W / 2, 120, "WAVE " + wave, "#ffd966", 2);
  }
}

function spawnZombie(type) {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * W; y = -30; }
  if (side === 1) { x = W + 30; y = Math.random() * H; }
  if (side === 2) { x = Math.random() * W; y = H + 30; }
  if (side === 3) { x = -30; y = Math.random() * H; }
  const t = ZTYPES[type];
  const scale = 1 + wave * 0.03;
  const hp = type === "boss" ? t.hp + wave * 4 : t.hp;
  zombies.push({ x, y, type, r: t.r, hp, maxHp: hp, speed: t.speed * (type === "boss" ? 1 : scale),
                 dmg: t.dmg, color: t.color, points: t.points, atkCd: 0, wob: Math.random() * 6 });
}

// ===================== HELPERS =====================
function addFloater(x, y, text, color = "#fff", life = 0.8) { floaters.push({ x, y, text, color, life, max: life }); }
function blood(x, y, n, speed = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * speed;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.4, max: 0.8,
                     color: Math.random() < 0.5 ? "#8b0000" : "#b22222", size: 2 + Math.random() * 3 });
  }
}
function startReload() {
  if (state !== "playing" || player.reloading || player.mag === player.magSize) return;
  player.reloading = true; player.reloadT = 1.2;
}
function shoot() {
  if (player.reloading || player.fireCd > 0) return;
  if (player.mag <= 0) { startReload(); return; }
  player.mag--; player.fireCd = 0.16; player.flash = 0.05; shake = Math.max(shake, 2);
  const spread = (Math.random() - 0.5) * 0.06;
  const a = player.angle + spread;
  const gx = player.x + Math.cos(player.angle) * 34, gy = player.y + Math.sin(player.angle) * 34;
  bullets.push({ x: gx, y: gy, vx: Math.cos(a) * 850, vy: Math.sin(a) * 850, life: 0.9 });
  if (player.mag === 0) startReload();
}

// ===================== UPDATE =====================
function update(dt) {
  // Player movement
  let dx = (keys["d"] || keys["arrowright"] ? 1 : 0) - (keys["a"] || keys["arrowleft"] ? 1 : 0);
  let dy = (keys["s"] || keys["arrowdown"] ? 1 : 0) - (keys["w"] || keys["arrowup"] ? 1 : 0);
  if (dx || dy) { const l = Math.hypot(dx, dy); dx /= l; dy /= l; }
  player.x = Math.max(player.r, Math.min(W - player.r, player.x + dx * player.speed * dt));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y + dy * player.speed * dt));
  player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  player.fireCd = Math.max(0, player.fireCd - dt);
  player.flash = Math.max(0, player.flash - dt);
  player.hurtT = Math.max(0, player.hurtT - dt);
  if (player.reloading) { player.reloadT -= dt; if (player.reloadT <= 0) { player.reloading = false; player.mag = player.magSize; } }
  if (mouse.down) shoot();

  // Waves
  if (spawnQueue.length === 0 && zombies.length === 0) {
    intermission -= dt;
    if (intermission <= 0) { startWave(); intermission = 3; }
  } else if (spawnQueue.length > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnZombie(spawnQueue.pop()); spawnTimer = Math.max(0.25, 1.1 - wave * 0.06); }
  }

  // Bullets
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const z of zombies) {
      if (z.hp <= 0) continue;
      if (Math.hypot(z.x - b.x, z.y - b.y) < z.r) {
        z.hp--; b.life = 0;
        blood(b.x, b.y, 6);
        z.x += b.vx * 0.01; z.y += b.vy * 0.01; // knockback
        if (z.hp <= 0) {
          score += z.points; kills++;
          blood(z.x, z.y, 18, 240);
          addFloater(z.x, z.y - 10, "+" + z.points, "#ffd966");
          if (z.type === "boss") {
            shake = 16;
            addFloater(W / 2, 160, "BOSS DEFEATED!", "#ffd966", 3);
            pickups.push({ x: z.x - 20, y: z.y, type: "health" }, { x: z.x + 20, y: z.y, type: "ammo" });
          } else if (Math.random() < 0.15) pickups.push({ x: z.x, y: z.y, type: Math.random() < 0.7 ? "health" : "ammo" });
        }
        break;
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0 && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  zombies = zombies.filter(z => z.hp > 0);

  // Boss summons minions
  if (zombies.some(z => z.type === "boss")) {
    bossTimer -= dt;
    if (bossTimer <= 0) { spawnZombie(Math.random() < 0.5 ? "walker" : "runner"); bossTimer = 3.5; }
  }

  // Zombies
  for (const z of zombies) {
    z.wob += dt * 6;
    const a = Math.atan2(player.y - z.y, player.x - z.x);
    z.angle = a;
    z.x += Math.cos(a) * z.speed * dt;
    z.y += Math.sin(a) * z.speed * dt;
    z.atkCd = Math.max(0, z.atkCd - dt);
    if (Math.hypot(player.x - z.x, player.y - z.y) < z.r + player.r && z.atkCd <= 0) {
      z.atkCd = 0.8; player.hp -= z.dmg; player.hurtT = 0.25; shake = 8;
      blood(player.x, player.y, 8);
      if (player.hp <= 0) {
        player.hp = 0; state = "gameover";
        if (score > highScore) { highScore = score; localStorage.setItem("svz_high", highScore); }
      }
    }
  }
  // Soft separation between zombies
  for (let i = 0; i < zombies.length; i++) for (let j = i + 1; j < zombies.length; j++) {
    const a = zombies[i], b = zombies[j];
    const d = Math.hypot(a.x - b.x, a.y - b.y), min = a.r + b.r - 4;
    if (d > 0 && d < min) { const push = (min - d) / 2, nx = (a.x - b.x) / d, ny = (a.y - b.y) / d;
      a.x += nx * push; a.y += ny * push; b.x -= nx * push; b.y -= ny * push; }
  }

  // Pickups
  for (const p of pickups) {
    if (Math.hypot(player.x - p.x, player.y - p.y) < 24) {
      p.taken = true;
      if (p.type === "health") { player.hp = Math.min(player.maxHp, player.hp + 25); addFloater(p.x, p.y, "+25 HP", "#6aff6a"); }
      else { player.mag = player.magSize; player.reloading = false; addFloater(p.x, p.y, "AMMO", "#6ab0ff"); }
    }
  }
  pickups = pickups.filter(p => !p.taken);

  // Particles & floaters
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.y -= 25 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
  shake = Math.max(0, shake - 30 * dt);
}

// ===================== DRAW =====================
function drawGround() {
  ctx.fillStyle = "#2b3a2b"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(255,255,255,0.04)"; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
}

function drawSoldier() {
  const p = player;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
  // gun
  ctx.fillStyle = "#222"; ctx.fillRect(6, -4, 30, 8);
  ctx.fillStyle = "#444"; ctx.fillRect(28, -3, 10, 6);
  // arms
  ctx.fillStyle = "#4a5d23";
  ctx.beginPath(); ctx.arc(14, -9, 5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(22, 7, 5, 0, 7); ctx.fill();
  // body
  ctx.fillStyle = p.hurtT > 0 ? "#ff6b6b" : "#556b2f";
  ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 7); ctx.fill();
  ctx.strokeStyle = "#2f3e14"; ctx.lineWidth = 2; ctx.stroke();
  // helmet
  ctx.fillStyle = "#3c4a1c";
  ctx.beginPath(); ctx.arc(-1, 0, 10, 0, 7); ctx.fill();
  ctx.fillStyle = "#6b8e23"; ctx.beginPath(); ctx.arc(1, 0, 4, 0, 7); ctx.fill();
  // muzzle flash
  if (p.flash > 0) {
    ctx.fillStyle = "#ffe066"; ctx.beginPath();
    ctx.moveTo(38, 0); ctx.lineTo(54, -7); ctx.lineTo(48, 0); ctx.lineTo(54, 7); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawZombie(z) {
  ctx.save(); ctx.translate(z.x, z.y); ctx.rotate(z.angle || 0);
  const sway = Math.sin(z.wob) * 3;
  // arms
  ctx.fillStyle = z.color;
  ctx.beginPath(); ctx.arc(z.r * 0.9, -z.r * 0.6 + sway, z.r * 0.3, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(z.r * 0.9, z.r * 0.6 - sway, z.r * 0.3, 0, 7); ctx.fill();
  // body
  ctx.fillStyle = z.color; ctx.beginPath(); ctx.arc(0, 0, z.r, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 2; ctx.stroke();
  // wounds
  ctx.fillStyle = "#7a1010"; ctx.beginPath(); ctx.arc(-z.r * 0.3, z.r * 0.3, z.r * 0.25, 0, 7); ctx.fill();
  // eyes
  ctx.fillStyle = "#ff2a2a";
  ctx.beginPath(); ctx.arc(z.r * 0.45, -z.r * 0.3, 2.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(z.r * 0.45, z.r * 0.3, 2.5, 0, 7); ctx.fill();
  if (z.type === "boss") {
    // spikes/horns and glowing eyes
    ctx.fillStyle = "#2a0a3a";
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(-z.r * 0.2, i * 12 - 6); ctx.lineTo(-z.r * 0.9, i * 16); ctx.lineTo(-z.r * 0.2, i * 12 + 6); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = "#ff1744"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, z.r + 3, 0, 7); ctx.stroke();
  }
  ctx.restore();
  // health bar for tougher zombies (boss uses the big bar at the top)
  if (z.type !== "boss" && z.maxHp > 1 && z.hp < z.maxHp) {
    ctx.fillStyle = "#000"; ctx.fillRect(z.x - 16, z.y - z.r - 10, 32, 4);
    ctx.fillStyle = "#e33"; ctx.fillRect(z.x - 16, z.y - z.r - 10, 32 * (z.hp / z.maxHp), 4);
  }
}

function drawHUD() {
  // health bar
  ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(16, 16, 220, 22);
  ctx.fillStyle = player.hp > 35 ? "#4caf50" : "#e53935";
  ctx.fillRect(18, 18, 216 * (player.hp / player.maxHp), 18);
  ctx.fillStyle = "#fff"; ctx.font = "bold 13px Segoe UI, Arial"; ctx.textAlign = "left";
  ctx.fillText("HP " + Math.ceil(player.hp), 24, 32);
  // ammo
  ctx.font = "bold 18px Segoe UI, Arial";
  ctx.fillText(player.reloading ? "RELOADING..." : "AMMO " + player.mag + " / " + player.magSize, 16, 62);
  // score
  ctx.textAlign = "right";
  ctx.fillText("Score " + score, W - 16, 30);
  ctx.font = "14px Segoe UI, Arial"; ctx.fillStyle = "#ccc";
  ctx.fillText("Wave " + wave + "   Kills " + kills + "   Best " + highScore, W - 16, 52);
  ctx.textAlign = "left";
  // boss health bar
  const boss = zombies.find(z => z.type === "boss");
  if (boss) {
    const bw = 400, bx = W / 2 - bw / 2;
    ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(bx - 2, 68, bw + 4, 20);
    ctx.fillStyle = "#c62828"; ctx.fillRect(bx, 70, bw * (boss.hp / boss.maxHp), 16);
    ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.font = "bold 13px Segoe UI, Arial";
    ctx.fillText("ZOMBIE BOSS", W / 2, 82); ctx.textAlign = "left";
  }
}

function centerText(text, y, size, color = "#fff") {
  ctx.textAlign = "center"; ctx.fillStyle = color; ctx.font = "bold " + size + "px Segoe UI, Arial";
  ctx.fillText(text, W / 2, y); ctx.textAlign = "left";
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawGround();

  if (state === "menu") {
    ctx.restore();
    ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0, 0, W, H);
    centerText("SOLDIER vs ZOMBIES", 220, 54, "#ff4d4d");
    centerText("WASD / Arrows: move     Mouse: aim     Click: shoot", 300, 20);
    centerText("R: reload     P: pause", 330, 20);
    centerText("Survive as many waves as you can. Grab drops from dead zombies.", 370, 16, "#ccc");
    centerText("Click or press Enter to start", 440, 26, "#ffd966");
    if (highScore) centerText("Best score: " + highScore, 480, 18, "#aaa");
    return;
  }

  for (const p of pickups) {
    ctx.fillStyle = p.type === "health" ? "#2ecc71" : "#3498db";
    ctx.fillRect(p.x - 9, p.y - 9, 18, 18);
    ctx.fillStyle = "#fff"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
    ctx.fillText(p.type === "health" ? "+" : "A", p.x, p.y + 5); ctx.textAlign = "left";
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  for (const z of zombies) drawZombie(z);
  if (state === "playing") drawSoldier();
  ctx.strokeStyle = "#ffe066"; ctx.lineWidth = 2;
  for (const b of bullets) { ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.02, b.y - b.vy * 0.02); ctx.stroke(); }
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, f.life / f.max); ctx.fillStyle = f.color;
    ctx.font = "bold 20px Segoe UI, Arial"; ctx.textAlign = "center"; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = "left";
  ctx.restore();

  // crosshair
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 9, 0, 7); ctx.moveTo(mouse.x - 14, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y);
  ctx.moveTo(mouse.x + 5, mouse.y); ctx.lineTo(mouse.x + 14, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - 14); ctx.lineTo(mouse.x, mouse.y - 5);
  ctx.moveTo(mouse.x, mouse.y + 5); ctx.lineTo(mouse.x, mouse.y + 14); ctx.stroke();

  // low health vignette
  if (player.hp < 35 && state === "playing") {
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.8);
    g.addColorStop(0, "rgba(150,0,0,0)"); g.addColorStop(1, "rgba(150,0,0,0.45)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  drawHUD();

  if (intermission > 0 && spawnQueue.length === 0 && zombies.length === 0 && state === "playing" && wave > 0)
    centerText("Wave cleared! Next wave incoming...", 200, 24, "#9fe870");
  if (paused) { ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0, 0, W, H); centerText("PAUSED (press P)", H / 2, 44); }
  if (state === "gameover") {
    ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 0, W, H);
    centerText("YOU WERE OVERRUN", 240, 52, "#ff4d4d");
    centerText("Score " + score + "   |   Wave " + wave + "   |   Kills " + kills, 300, 24);
    centerText("Best: " + highScore, 335, 20, "#ffd966");
    centerText("Click or press Enter to try again", 410, 24, "#fff");
  }
}

// ===================== LOOP =====================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === "playing" && !paused) update(dt);
  draw();
  requestAnimationFrame(loop);
}
resetGame(); state = "menu";
requestAnimationFrame(loop);
</script>
</body>
</html>
